<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2b">
<title>Home Energy Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b2b;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:16px}
header{padding:12px 2px 24px}h1{font-size:27px;margin:0 0 6px}.sub{color:#9eafc3;font-size:13px}
.energy-map{position:relative;width:100%;max-width:560px;aspect-ratio:2/3;margin:0 auto}
.energy-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));column-gap:1.25%;row-gap:1.25%;align-items:center;justify-items:center}
.card{position:relative;z-index:1;background:#1b2b40;border:1px solid #30445c;border-radius:16px;padding:clamp(7px,2vw,14px);min-width:0;min-height:0;width:120%;height:auto;aspect-ratio:1;align-self:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}
.card .label{font-size:clamp(10px,2.5vw,14px);color:#aebed0;margin-bottom:9px;line-height:1.2}
.value{font-size:clamp(16px,4.5vw,29px);font-weight:700;letter-spacing:-.7px;white-space:nowrap}
.unit{font-size:clamp(9px,2vw,12px);color:#aebed0;font-weight:400}
.note{font-size:clamp(9px,2.2vw,12px);color:#9eafc3;margin-top:8px;line-height:1.25}
#solarcard{grid-area:1/1}#evcard{grid-area:1/3}#homecard{grid-area:2/2}#gridcard{grid-area:3/1}#batterycard{grid-area:3/3}
.battery-card.charging{border-color:#27bd78}.battery-card.discharging{border-color:#398de8}
.battery-card{justify-content:space-between}
.battery-card .label{margin-bottom:0}
.battery-middle{display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,13px);width:100%}
.battery-state{font-size:clamp(10px,2.4vw,13px);font-weight:600;margin-top:0;min-height:1.2em;text-align:center}
.battery-card.charging .battery-state{color:#35d48b}.battery-card.discharging .battery-state{color:#65aaff}
.battery-visual{display:flex;align-items:center;gap:6px;margin-top:0}
.battery-shell{position:relative;width:clamp(28px,7vw,38px);height:clamp(48px,11vw,62px);border:2px solid #aebed0;border-radius:6px;padding:3px;display:flex;align-items:flex-end;overflow:hidden}
.battery-shell:before{content:"";position:absolute;width:9px;height:3px;background:#aebed0;border-radius:2px 2px 0 0;top:-5px;left:5px}
.battery-fill{width:100%;height:0%;background:#8ba2bb;border-radius:2px;transition:height .3s,background .3s}
.battery-card.charging .battery-fill{background:#27bd78}.battery-card.discharging .battery-fill{background:#398de8}
.battery-percent{position:absolute;z-index:2;left:0;right:0;bottom:4px;text-align:center;font-size:clamp(8px,1.8vw,10px);font-weight:800;color:#fff;text-shadow:0 1px 3px #07111f,0 0 3px #07111f}
.flow-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible;pointer-events:none}
.flow-lines path{fill:none;stroke:#64748b;stroke-width:1.1;stroke-dasharray:2.1 2.1;stroke-linecap:round;opacity:.8}
.flow-lines path.active{opacity:1;animation:dash-flow 3s linear infinite}
.flow-lines path.green{stroke:#27d889}.flow-lines path.blue{stroke:#4c9cff}.flow-lines path.red{stroke:#ff5964}
.flow-lines path.reverse{animation-name:dash-flow-reverse}
#solarcard.flow-green,#evcard.flow-blue,#gridcard.flow-red,#gridcard.flow-green,#batterycard.flow-green,#batterycard.flow-blue{border-color:var(--flow-colour)}
#solarcard.flow-green,#evcard.flow-blue,#gridcard.flow-red,#gridcard.flow-green,#batterycard.flow-green,#batterycard.flow-blue{--flow-colour:#27d889}
#evcard.flow-blue,#batterycard.flow-blue{--flow-colour:#4c9cff}
#gridcard.flow-red{--flow-colour:#ff5964}
@keyframes dash-flow{to{stroke-dashoffset:-8.4}}
@keyframes dash-flow-reverse{to{stroke-dashoffset:8.4}}
.status{margin-top:20px;background:#1b2b40;border-radius:14px;padding:15px;color:#aebed0;font-size:13px}
footer{color:#778ba3;font-size:11px;text-align:center;margin:22px 0}
@media(min-width:600px){body{max-width:700px;margin:auto}}
@media(prefers-reduced-motion:reduce){.flow-lines path.active{animation:none}}
</style>
</head>
<body>
<header>
<h1>Home Energy</h1>
<div class="sub">Fox ESS KH7 · 2 × EP12 · Hypervolt 2</div>
</header>
<div class="energy-map" aria-label="Live home energy flow">
<svg class="flow-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path id="solarflow" d="M16.25 35.75 H23.375 V38.3 H30.5"/>
  <path id="evflow" d="M83.75 35.75 H76.625 V38.3 H69.5"/>
  <path id="gridflow" d="M16.25 64.25 H23.375 V61.7 H30.5"/>
  <path id="batteryflow" d="M83.75 64.25 H76.625 V61.7 H69.5"/>
</svg>
<div class="energy-grid">
  <div class="card" id="solarcard"><div class="label">☀️ Solar</div><div class="value" id="solar">— <span class="unit">kW</span></div><div class="note">Generation</div></div>
  <div class="card" id="evcard"><div class="label">🚗 EV charging</div><div class="value" id="ev">— <span class="unit">kW</span></div><div class="note" id="evstatus">Awaiting connection</div></div>
  <div class="card" id="homecard"><div class="label">🏠 Home</div><div class="value" id="home">— <span class="unit">kW</span></div><div class="note">Consumption</div></div>
  <div class="card" id="gridcard"><div class="label">⚡ Grid</div><div class="value" id="grid">— <span class="unit">kW</span></div><div class="note" id="gridnote">Import / export</div></div>
  <div class="card battery-card" id="batterycard">
    <div class="label">🔋 Battery</div>
    <div class="battery-middle">
      <div class="value" id="battery">— <span class="unit">kW</span></div>
      <div class="battery-visual"><div class="battery-shell" aria-label="Battery charge level"><div class="battery-fill" id="batteryfill"></div><div class="battery-percent" id="soc">—%</div></div></div>
    </div>
    <div class="battery-state" id="batterystate">Standby</div>
  </div>
</div>
</div>
<div class="status" id="status">Dashboard created. Live data connection not yet configured.</div>
<footer>Personal energy dashboard</footer>

<script>
const FOX_WORKER = "https://energy-api.gerbenbouma.workers.dev/";
const HYPERVOLT_WORKER = FOX_WORKER + "hypervolt";

function kw(value) {
  return Number(value || 0).toFixed(2);
}

async function loadEnergyData() {
  const status = document.getElementById("status");
  let password = sessionStorage.getItem("energyPassword");

  if (!password) {
    password = prompt("Enter your energy dashboard password");
    if (!password) {
      status.textContent = "Password required.";
      return;
    }
    sessionStorage.setItem("energyPassword", password);
  }

  status.textContent = "Updating Fox ESS readings...";

  try {
    const response = await fetch(FOX_WORKER, {
      headers: { "X-Dashboard-Password": password }
    });

    if (response.status === 401) {
      sessionStorage.removeItem("energyPassword");
      status.textContent = "Password incorrect. Refresh to try again.";
      return;
    }

    const data = await response.json();

    if (!response.ok) throw new Error(JSON.stringify(data));

    const readings = data.result[0].datas;
    const values = {};

    readings.forEach(item => {
      values[item.variable] = item.value;
    });

    const solar = Number(values.pvPower || 0);
    const home = Number(values.loadsPower || 0);
    const charge = Number(values.batChargePower || 0);
    const discharge = Number(values.batDischargePower || 0);
    const soc = Number(values.SoC || 0);
    const gridImport = Number(values.gridConsumptionPower || 0);
    const gridExport = Number(values.feedinPower || 0);

    document.getElementById("solar").innerHTML =
      kw(solar) + ' <span class="unit">kW</span>';

    document.getElementById("home").innerHTML =
      kw(home) + ' <span class="unit">kW</span>';

    document.getElementById("grid").innerHTML =
      kw(Math.max(gridImport, gridExport)) + ' <span class="unit">kW</span>';

    const batteryCharging = charge > 0.01;
    const batteryDischarging = discharge > 0.01;
    const batteryPower = batteryCharging ? charge : batteryDischarging ? discharge : 0;
    const batteryState = batteryCharging ? "Charging" : batteryDischarging ? "Discharging" : "Standby";
    const batteryCard = document.getElementById("batterycard");

    document.getElementById("battery").innerHTML =
      kw(batteryPower) + ' <span class="unit">kW</span>';
    document.getElementById("batterystate").textContent = batteryState;
    document.getElementById("soc").textContent = Math.max(0, Math.min(100, soc)) + "%";
    document.getElementById("batteryfill").style.height =
      Math.max(0, Math.min(100, soc)) + "%";
    batteryCard.classList.toggle("charging", batteryCharging);
    batteryCard.classList.toggle("discharging", !batteryCharging && batteryDischarging);

    document.getElementById("gridnote").textContent =
      gridImport > 0.01 ? "Importing" :
      gridExport > 0.01 ? "Exporting" : "No grid flow";

    // Animate each connection in the direction energy is flowing.
    function setFlow(id, active, colour, reverse) {
      const line = document.getElementById(id);
      // Inactive lines get only the default grey stroke; never retain a colour class.
      line.setAttribute("class", [active ? "active" : "", active ? (colour || "") : "", active && reverse ? "reverse" : ""].filter(Boolean).join(" "));
    }
    const solarActive = solar > 0.01;
    const gridActive = gridImport > 0.01 || gridExport > 0.01;
    const gridColour = gridImport > 0.01 ? "red" : "green";
    const batteryColour = batteryCharging ? "green" : "blue";
    document.getElementById("solarcard").classList.toggle("flow-green", solarActive);
    document.getElementById("evcard").classList.remove("flow-blue");
    document.getElementById("gridcard").classList.toggle("flow-red", gridActive && gridColour === "red");
    document.getElementById("gridcard").classList.toggle("flow-green", gridActive && gridColour === "green");
    document.getElementById("batterycard").classList.toggle("flow-green", batteryCharging);
    document.getElementById("batterycard").classList.toggle("flow-blue", !batteryCharging && batteryDischarging);
    setFlow("solarflow", solarActive, "green", false);       // Solar -> home
    setFlow("evflow", false, "blue", false);                 // Home -> EV (set after EV reading)
    setFlow("gridflow", gridImport > 0.01 || gridExport > 0.01,
      gridImport > 0.01 ? "red" : "green", gridExport > 0.01); // Import -> home; export <- home
    setFlow("batteryflow", batteryCharging || batteryDischarging,
      batteryCharging ? "green" : "blue", batteryCharging); // Home -> battery; battery -> home

    try {
      const evResponse = await fetch(HYPERVOLT_WORKER, {
        headers: { "X-Dashboard-Password": password }
      });
      const evData = await evResponse.json();

      if (!evResponse.ok) throw new Error(evData.details || evData.error || "Connection failed");
      if (!evData.chargerId) throw new Error("Hypervolt endpoint is not deployed yet");
      const evWatts = Number(evData.evPowerW || 0);
      const evActive = evWatts > 10;
      setFlow("evflow", evActive, "blue", true);
      document.getElementById("evcard").classList.toggle("flow-blue", evActive);

      if (evData.evPowerW === null || evData.evPowerW === undefined) {
        document.getElementById("ev").innerHTML =
          '— <span class="unit">kW</span>';
        document.getElementById("evstatus").textContent =
          evData.charging === false ? "Connected · Not charging" : "Connected · Power not currently reported";
      } else {
        document.getElementById("ev").innerHTML =
          kw(Number(evData.evPowerW) / 1000) + ' <span class="unit">kW</span>';
        document.getElementById("evstatus").textContent =
          evData.charging === true ? "Charging · Live Hypervolt reading" :
          evData.charging === false ? "Connected · Not charging" :
          "Live Hypervolt reading";
      }
    } catch (evError) {
      setFlow("evflow", false, "blue", false);
      document.getElementById("evcard").classList.remove("flow-blue");
      document.getElementById("ev").innerHTML =
        '— <span class="unit">kW</span>';
      document.getElementById("evstatus").textContent =
        "Hypervolt unavailable: " + evError.message;
    }

    const oldRaw = document.getElementById("foxData");
    if (oldRaw) oldRaw.remove();

    status.textContent =
      "Fox ESS connected · Updated " + data.result[0].time;

  } catch (error) {
    status.textContent = "Update failed: " + error.message;
  }
}

loadEnergyData();
setInterval(loadEnergyData, 300000);
</script>

</body>
</html>
