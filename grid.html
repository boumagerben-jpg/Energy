<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2b">
<title>Grid import & export · Home Energy</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101b2b;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:760px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 22px}
.header-title h1{font-size:25px;margin:0}.home-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid #40566f;border-radius:12px;background:#1b2b40;color:#dce7f3;text-decoration:none;font-size:21px;flex:0 0 auto}
.sub{color:#9eafc3;font-size:13px;margin-top:4px}
.panel{background:#1b2b40;border:1px solid #30445c;border-radius:18px;padding:18px;margin-bottom:16px}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.meter{text-align:center;min-width:0}.meter-title{font-size:15px;font-weight:700;margin-bottom:6px}
.gauge-wrap{position:relative;width:100%;max-width:185px;margin:auto}.gauge{display:block;width:100%;height:auto}
.gauge-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.current{font-size:clamp(23px,6vw,31px);font-weight:800;letter-spacing:-1.5px;line-height:1}
.current span{font-size:15px;color:#aebed0;font-weight:500;letter-spacing:0}
.gauge-caption{font-size:12px;color:#aebed0;margin-top:8px}
.max-label{display:flex;justify-content:space-between;color:#9eafc3;font-size:11px;margin-top:-6px}
.daily{margin-top:14px;padding-top:12px;border-top:1px solid #40566f}
.daily-label{font-size:12px;color:#aebed0}.daily-value{font-size:25px;font-weight:750;letter-spacing:-.7px;margin-top:3px}.daily-value span{font-size:13px;color:#aebed0;font-weight:500}
.section-title{font-size:17px;font-weight:700;margin:0 0 14px}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.controls button{border:1px solid #40566f;border-radius:10px;background:#17263a;color:#dce7f3;padding:9px 12px;font-size:13px;cursor:pointer}
.controls button.active{background:#24496b;border-color:#5da5e8;color:#fff}
.period-picker{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#aebed0;font-size:12px;flex-wrap:wrap}
.period-picker input{background:#142338;border:1px solid #40566f;border-radius:8px;color:#f4f7fb;padding:7px;font:inherit}
.chart-wrap{width:100%;overflow:hidden}svg.chart{display:block;width:100%;height:auto;min-height:190px}
.legend{display:flex;gap:16px;align-items:center;color:#aebed0;font-size:11px;margin-top:10px}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.bar-detail{color:#f4f7fb;font-size:13px;min-height:20px;margin-top:7px;font-weight:600}.status{color:#91a6bd;font-size:12px;min-height:18px;margin-top:10px}
.chart-panel{margin-top:14px;padding-top:14px;border-top:1px solid #40566f}
.chart-heading{font-size:15px;font-weight:700;margin:0 0 8px}
@media(max-width:420px){body{padding:12px}.panel{padding:14px}.summary{gap:8px}.daily-value{font-size:22px}.current{font-size:23px}}
</style>
</head>
<body>
<header><div class="header-title"><h1>Grid import &amp; export</h1><div class="sub">Live grid power · Daily energy totals</div></div><a class="home-button" href="index.html" aria-label="Back to home" title="Home">⌂</a></header>
<section class="panel summary">
  <div class="meter">
    <div class="meter-title">Import</div>
    <div class="gauge-wrap"><svg class="gauge" viewBox="0 0 240 240" role="img" aria-label="Grid import power gauge"><circle cx="120" cy="120" r="91" fill="none" stroke="#53657a" stroke-width="13" pathLength="100" stroke-dasharray="88 12" transform="rotate(111.6 120 120)"/><circle id="importArc" cx="120" cy="120" r="91" fill="none" stroke="#ff5964" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(111.6 120 120)"/></svg><div class="gauge-value"><div class="current" id="importPower">— <span>kW</span></div><div class="gauge-caption">Importing now</div></div></div>
    <div class="max-label"><span>0 kW</span><span>15 kW max</span></div>
    <div class="daily"><div class="daily-label">Imported today</div><div class="daily-value"><span id="importToday">—</span> <span>kWh</span></div></div>
  </div>
  <div class="meter">
    <div class="meter-title">Export</div>
    <div class="gauge-wrap"><svg class="gauge" viewBox="0 0 240 240" role="img" aria-label="Grid export power gauge"><circle cx="120" cy="120" r="91" fill="none" stroke="#53657a" stroke-width="13" pathLength="100" stroke-dasharray="88 12" transform="rotate(111.6 120 120)"/><circle id="exportArc" cx="120" cy="120" r="91" fill="none" stroke="#27d889" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(111.6 120 120)"/></svg><div class="gauge-value"><div class="current" id="exportPower">— <span>kW</span></div><div class="gauge-caption">Exporting now</div></div></div>
    <div class="max-label"><span>0 kW</span><span>5 kW max</span></div>
    <div class="daily"><div class="daily-label">Exported today</div><div class="daily-value"><span id="exportToday">—</span> <span>kWh</span></div></div>
  </div>
</section>
<section class="panel">
  <h2 class="section-title">Grid energy history</h2>
  <div class="controls" role="group" aria-label="Chart period">
    <button type="button" data-mode="last7" class="active">Last 7 days</button>
    <button type="button" data-mode="week">Week</button>
    <button type="button" data-mode="month">Month</button>
    <button type="button" data-mode="year">Year</button>
  </div>
  <div class="period-picker" id="periodPicker" hidden></div>
  <div class="chart-panel" style="margin-top:0;padding-top:0;border-top:0">
    <h3 class="chart-heading">Import</h3>
    <div class="chart-wrap"><svg class="chart" id="importChart" viewBox="0 0 640 260" role="img" aria-label="Grid import energy history chart"></svg></div>
    <div class="legend"><span><i class="key" style="background:#ff5964"></i>Import</span></div>
  </div>
  <div class="chart-panel">
    <h3 class="chart-heading">Export</h3>
    <div class="chart-wrap"><svg class="chart" id="exportChart" viewBox="0 0 640 260" role="img" aria-label="Grid export energy history chart"></svg></div>
    <div class="legend"><span><i class="key" style="background:#27d889"></i>Export</span></div>
  </div>
  <div class="status" id="historyStatus">Loading grid history…</div>
</section>
<script>
const API="https://energy-api.gerbenbouma.workers.dev/";
const today=new Date(),todayISO=localISO(today);
function getStoredEnergyPassword(){
  const expiry=Number(localStorage.getItem("energyPasswordExpiry")||0);
  if(expiry<=Date.now()){
    localStorage.removeItem("energyPassword");
    localStorage.removeItem("energyPasswordExpiry");
    return null;
  }
  return localStorage.getItem("energyPassword");
}
let password=getStoredEnergyPassword(),mode="last7",selectedDate=todayISO;
function localISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateFromISO(s){return new Date(s+"T12:00:00")}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function getPassword(){if(!password){password=prompt("Enter your energy dashboard password");if(!password)throw new Error("Dashboard password required.");localStorage.setItem("energyPassword",password);localStorage.setItem("energyPasswordExpiry",String(Date.now()+14*24*60*60*1000))}return password}
async function loadLive(){
 try{
  const p=await getPassword();
  const [liveRes,dailyRes]=await Promise.all([fetch(API,{headers:{"X-Dashboard-Password":p}}),fetch(API+"daily",{headers:{"X-Dashboard-Password":p}})]);
  if(liveRes.status===401||dailyRes.status===401){localStorage.removeItem("energyPassword");localStorage.removeItem("energyPasswordExpiry");password=null;throw new Error("Password incorrect. Refresh and try again.")}
  const live=await liveRes.json(),daily=await dailyRes.json();
  if(!liveRes.ok)throw new Error(live.details||live.error||"Live data unavailable");
  if(!dailyRes.ok)throw new Error(daily.details||daily.error||"Daily totals unavailable");
  const v={};(live.result?.[0]?.datas||[]).forEach(x=>v[String(x.variable||"").toLowerCase()]=Number(x.value||0));
  const imp=Math.max(0,v.gridconsumptionpower||0),exp=Math.max(0,v.feedinpower||0);
  document.getElementById("importPower").innerHTML=imp.toFixed(2)+' <span>kW</span>';
  document.getElementById("exportPower").innerHTML=exp.toFixed(2)+' <span>kW</span>';
  document.getElementById("importArc").setAttribute("stroke-dasharray",(Math.min(imp,15)/15*88).toFixed(2)+" 100");
  document.getElementById("exportArc").setAttribute("stroke-dasharray",(Math.min(exp,5)/5*88).toFixed(2)+" 100");
  document.getElementById("importToday").textContent=daily.gridImportKWh==null?"—":Number(daily.gridImportKWh).toFixed(2);
  document.getElementById("exportToday").textContent=daily.gridExportKWh==null?"—":Number(daily.gridExportKWh).toFixed(2);
 }catch(e){document.getElementById("historyStatus").textContent=e.message}
}
function renderPicker(){
 const p=document.getElementById("periodPicker");
 if(mode==="last7"){p.hidden=true;p.innerHTML="";return}
 p.hidden=false;
 if(mode==="week")p.innerHTML='<label for="periodDate">Week starting (Monday)</label><input id="periodDate" type="date" value="'+localISO(mondayOf(dateFromISO(selectedDate)))+'" max="'+todayISO+'">';
 if(mode==="month")p.innerHTML='<label for="periodDate">Month</label><input id="periodDate" type="month" value="'+selectedDate.slice(0,7)+'" max="'+todayISO.slice(0,7)+'">';
 if(mode==="year")p.innerHTML='<label for="periodDate">Year</label><input id="periodDate" type="number" min="2000" max="'+today.getFullYear()+'" step="1" value="'+selectedDate.slice(0,4)+'">';
 p.querySelector("input").addEventListener("change",e=>{if(mode==="month")selectedDate=e.target.value+"-15";else if(mode==="year")selectedDate=e.target.value+"-06-15";else selectedDate=e.target.value;loadHistory()});
}
function makeLabels(dim,date,count){
 const d=dateFromISO(date),out=[];
 if(dim==="week"){for(let i=0;i<7;i++){const x=new Date(d);x.setDate(x.getDate()+i);out.push({label:x.toLocaleDateString("en-GB",{weekday:"short"}),date:localISO(x),current:localISO(x)===todayISO})}}
 else if(dim==="month"){for(let i=0;i<count;i++){const x=new Date(d.getFullYear(),d.getMonth(),i+1,12);out.push({label:String(i+1),date:localISO(x),current:localISO(x)===todayISO})}}
 else{for(let i=0;i<count;i++){const x=new Date(d.getFullYear(),i,15,12);out.push({label:x.toLocaleDateString("en-GB",{month:"short"}),date:localISO(x),current:x.getFullYear()===today.getFullYear()&&x.getMonth()===today.getMonth()})}}
 return out.slice(-count);
}

function showBarValue(svg,bar){
  const old=svg.querySelector("#barValuePopup");if(old)old.remove();
  const x=Number(bar.getAttribute("x")),y=Number(bar.getAttribute("y")),w=Number(bar.getAttribute("width"));
  const cx=x+w/2,boxW=112,boxH=30,px=Math.max(4,Math.min(640-boxW-4,cx-boxW/2)),py=Math.max(4,y-boxH-8);
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("id","barValuePopup");g.setAttribute("pointer-events","none");
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("x",px);r.setAttribute("y",py);r.setAttribute("width",boxW);r.setAttribute("height",boxH);r.setAttribute("rx","7");r.setAttribute("fill","#f4f7fb");r.setAttribute("stroke","#17263a");r.setAttribute("stroke-width","1.5");
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",px+boxW/2);t.setAttribute("y",py+20);t.setAttribute("fill","#101b2b");t.setAttribute("font-size","14");t.setAttribute("font-weight","700");t.setAttribute("text-anchor","middle");t.textContent=Number(bar.dataset.value).toFixed(2)+" kWh";
  g.append(r,t);svg.append(g);
}

function drawChart(id,values,labels,colour){
 const svg=document.getElementById(id),W=640,H=280,L=58,R=12,T=12,B=62;
 const vals=values.map(v=>v==null?0:Math.max(0,v)),max=Math.max(1,...vals)*1.12,plotH=H-T-B,plotW=W-L-R,slot=plotW/Math.max(1,vals.length),barW=Math.max(3,Math.min(38,slot*.58));
 let s='<text x="14" y="'+(T+plotH/2)+'" fill="#aebed0" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 14 '+(T+plotH/2)+')">kWh</text>';
 for(let i=0;i<=4;i++){const y=T+plotH*i/4,v=max*(1-i/4);s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#40536a" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" fill="#9eafc3" font-size="15" text-anchor="end">'+v.toFixed(max<10?1:0)+'</text>'}
 vals.forEach((v,i)=>{const x=L+i*slot+(slot-barW)/2,h=v/max*plotH,y=T+plotH-h,isToday=!!labels[i]?.current;s+='<rect data-value="'+v.toFixed(2)+'" data-label="'+esc(labels[i]?.date||labels[i]?.label||"")+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="3" fill="'+colour+'" style="cursor:pointer"><title>'+esc(labels[i]?.date||labels[i]?.label)+': '+v.toFixed(2)+' kWh</title></rect>';const every=vals.length>20?Math.ceil(vals.length/12):1;if(i%every===0||i===vals.length-1)s+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(H-25)+'" fill="#aebed0" font-size="'+(vals.length>20?12:15)+'" text-anchor="middle">'+esc(labels[i]?.label||"")+'</text>'});
 svg.innerHTML=s;
}
async function loadHistory(){
 const status=document.getElementById("historyStatus");status.textContent="Contacting FoxCloud for grid history…";
 const dim=mode==="year"?"year":mode==="month"?"month":"week";
 const date=mode==="last7"?localISO(new Date(today.getFullYear(),today.getMonth(),today.getDate()-6,12)):selectedDate;
 try{
  const p=await getPassword();
  const response=await fetch(API+"grid-history?dimension="+dim+"&date="+encodeURIComponent(date),{headers:{"X-Dashboard-Password":p},signal:AbortSignal.timeout(18000)});
  const history=await response.json();
  if(response.status===401){localStorage.removeItem("energyPassword");localStorage.removeItem("energyPasswordExpiry");password=null}
  if(!response.ok)throw new Error(history.details||history.error||"Grid history unavailable");
  const labels=makeLabels(dim,date,history.importValues.length);
  drawChart("importChart",history.importValues,labels,"#ff5964");
  drawChart("exportChart",history.exportValues,makeLabels(dim,date,history.exportValues.length),"#27d889");
  const prettyMonth=dateFromISO(date).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  status.textContent=dim==="week"?"Daily totals · week starting "+dateFromISO(date).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):dim==="month"?"Daily totals · "+prettyMonth:"Monthly totals · "+date.slice(0,4);
 }catch(e){status.textContent=e.message;document.getElementById("importChart").innerHTML='<text x="320" y="125" fill="#9eafc3" font-size="14" text-anchor="middle">Historical data unavailable</text>';document.getElementById("exportChart").innerHTML='<text x="320" y="125" fill="#9eafc3" font-size="14" text-anchor="middle">Historical data unavailable</text>'}
}
document.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{mode=btn.dataset.mode;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b===btn));if(mode==="last7")selectedDate=todayISO;if(mode==="week")selectedDate=localISO(mondayOf(dateFromISO(todayISO)));renderPicker();loadHistory()}));
["import","export"].forEach(kind=>document.getElementById(kind+"Chart").addEventListener("click",e=>{const bar=e.target.closest("rect[data-value]");if(bar)showBarValue(e.currentTarget,bar);}));
renderPicker();loadLive();loadHistory();setInterval(loadLive,300000);
</script>
</body>
</html>
