<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2b">
<title>Solar generation · Home Energy</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101b2b;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:760px;margin-inline:auto}
header{display:flex;align-items:center;gap:12px;padding:8px 0 22px}
.back{color:#9fc5ef;text-decoration:none;font-size:15px;white-space:nowrap}
h1{font-size:25px;margin:0}.sub{color:#9eafc3;font-size:13px;margin-top:4px}
.panel{background:#1b2b40;border:1px solid #30445c;border-radius:18px;padding:18px;margin-bottom:16px}
.summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center;gap:10px}
.gauge-wrap{position:relative;width:100%;max-width:300px;margin:auto}
.gauge{display:block;width:100%;height:auto}
.gauge-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding-top:14px}
.current{font-size:clamp(29px,8vw,43px);font-weight:800;letter-spacing:-1.5px;line-height:1}
.current span{font-size:15px;color:#aebed0;font-weight:500;letter-spacing:0}
.gauge-caption{font-size:12px;color:#aebed0;margin-top:8px}
.max-label{display:flex;justify-content:space-between;color:#9eafc3;font-size:11px;margin-top:-6px}
.today{padding-left:12px;border-left:1px solid #40566f}
.today-label{font-size:13px;color:#aebed0}
.today-value{font-size:clamp(24px,6vw,36px);font-weight:750;letter-spacing:-1px;margin-top:8px;white-space:nowrap}
.today-unit{font-size:14px;color:#aebed0;font-weight:500}
.today-note{font-size:11px;color:#8298b1;margin-top:8px}
.section-title{font-size:17px;font-weight:700;margin:0 0 14px}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.controls button{border:1px solid #40566f;border-radius:10px;background:#17263a;color:#dce7f3;padding:9px 12px;font-size:13px;cursor:pointer}
.controls button.active{background:#24496b;border-color:#5da5e8;color:#fff}
.period-picker{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#aebed0;font-size:12px;flex-wrap:wrap}
.period-picker input{background:#142338;border:1px solid #40566f;border-radius:8px;color:#f4f7fb;padding:7px;font:inherit}
.chart-wrap{width:100%;overflow:hidden}
#chart{display:block;width:100%;height:auto;min-height:190px}
.legend{display:flex;gap:16px;align-items:center;color:#aebed0;font-size:11px;margin-top:10px}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:#438fe3}
.key.today-key{background:#27d889}
.status{color:#91a6bd;font-size:12px;min-height:18px;margin-top:10px}
@media(max-width:420px){body{padding:12px}.panel{padding:14px}.summary{gap:6px}.today{padding-left:9px}.today-value{font-size:25px}}
</style>
</head>
<body>
<header><a class="back" href="index.html">‹ Home</a><div><h1>Solar generation</h1><div class="sub">11 panels · 5.39 kWp maximum</div></div></header>
<section class="panel summary">
  <div>
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 240 150" role="img" aria-label="Current solar generation gauge">
        <path d="M25 125 A95 95 0 0 1 215 125" fill="none" stroke="#53657a" stroke-width="13" stroke-linecap="round"/>
        <path id="gaugeGreen" d="M25 125 A95 95 0 0 1 215 125" fill="none" stroke="#27d889" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
      </svg>
      <div class="gauge-value"><div class="current" id="currentPower">— <span>kW</span></div><div class="gauge-caption">Generating now</div></div>
    </div>
    <div class="max-label"><span>0 kW</span><span>5.39 kW max</span></div>
  </div>
  <div class="today"><div class="today-label">Generated today</div><div class="today-value" id="todayEnergy">—</div><div class="today-unit">kWh</div><div class="today-note">FoxCloud PV yield</div></div>
</section>
<section class="panel">
  <h2 class="section-title">Solar generation history</h2>
  <div class="controls" role="group" aria-label="Chart period">
    <button type="button" data-mode="last7" class="active">Last 7 days</button>
    <button type="button" data-mode="week">Select week</button>
    <button type="button" data-mode="month">Select month</button>
    <button type="button" data-mode="year">Select year</button>
  </div>
  <div class="period-picker" id="periodPicker" hidden></div>
  <div class="chart-wrap"><svg id="chart" viewBox="0 0 640 260" role="img" aria-label="Solar energy generated chart"></svg></div>
  <div class="legend"><span><i class="key"></i>Generation</span><span><i class="key today-key"></i>Current day</span></div>
  <div class="status" id="historyStatus">Loading solar history…</div>
</section>
<script>
const API = "https://energy-api.gerbenbouma.workers.dev/";
const MAX_KW = 5.39;
const today = new Date();
const todayISO = localISO(today);
let password = sessionStorage.getItem("energyPassword");
let mode = "last7";
let selectedDate = todayISO;

function localISO(date) {
  const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,"0"), d = String(date.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + d;
}
function dateFromISO(s) { return new Date(s + "T12:00:00"); }
function esc(s) { return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function getPassword() {
  if (!password) {
    password = prompt("Enter your energy dashboard password");
    if (!password) throw new Error("Dashboard password required.");
    sessionStorage.setItem("energyPassword",password);
  }
  return password;
}
async function loadLive() {
  try {
    const p = await getPassword();
    const [liveRes,dailyRes] = await Promise.all([
      fetch(API,{headers:{"X-Dashboard-Password":p}}),
      fetch(API+"daily",{headers:{"X-Dashboard-Password":p}})
    ]);
    if (liveRes.status===401 || dailyRes.status===401) {
      sessionStorage.removeItem("energyPassword"); password=null;
      throw new Error("Password incorrect. Refresh and try again.");
    }
    const live = await liveRes.json(), daily = await dailyRes.json();
    if (!liveRes.ok) throw new Error(live.details || live.error || "Live data unavailable");
    if (!dailyRes.ok) throw new Error(daily.details || daily.error || "Daily yield unavailable");
    const vals = {};
    (live.result?.[0]?.datas || []).forEach(x=>vals[x.variable]=Number(x.value||0));
    const kw = Math.max(0,vals.pvPower||0);
    document.getElementById("currentPower").innerHTML = kw.toFixed(2) + " <span>kW</span>";
    document.getElementById("gaugeGreen").setAttribute("stroke-dasharray",(Math.min(kw,MAX_KW)/MAX_KW*100).toFixed(2)+" 100");
    document.getElementById("todayEnergy").textContent = daily.solarKWh==null ? "—" : Number(daily.solarKWh).toFixed(2);
  } catch(e) {
    document.getElementById("currentPower").innerHTML = "— <span>kW</span>";
    document.getElementById("todayEnergy").textContent = "—";
    document.getElementById("historyStatus").textContent = e.message;
  }
}
function renderPicker() {
  const p=document.getElementById("periodPicker");
  if(mode==="last7"){p.hidden=true;p.innerHTML="";return;}
  p.hidden=false;
  if(mode==="week") p.innerHTML='<label for="periodDate">Week ending</label><input id="periodDate" type="date" value="'+selectedDate+'" max="'+todayISO+'">';
  if(mode==="month") p.innerHTML='<label for="periodDate">Month</label><input id="periodDate" type="month" value="'+selectedDate.slice(0,7)+'" max="'+todayISO.slice(0,7)+'">';
  if(mode==="year") p.innerHTML='<label for="periodDate">Year</label><input id="periodDate" type="number" min="2000" max="'+today.getFullYear()+'" step="1" value="'+selectedDate.slice(0,4)+'">';
  p.querySelector("input").addEventListener("change",e=>{
    if(mode==="month") selectedDate=e.target.value+"-15";
    else if(mode==="year") selectedDate=e.target.value+"-06-15";
    else selectedDate=e.target.value;
    loadHistory();
  });
}
function makeLabels(dim,date,count) {
  const d=dateFromISO(date), out=[];
  if(dim==="week"){
    // Fox's week report is the seven days ending on the selected date.
    for(let i=count-1;i>=0;i--){const x=new Date(d);x.setDate(x.getDate()-i);out.push({label:x.toLocaleDateString("en-GB",{weekday:"short"}),date:localISO(x),current:localISO(x)===todayISO});}
  } else if(dim==="month"){
    const y=d.getFullYear(),m=d.getMonth();
    for(let i=0;i<count;i++){const x=new Date(y,m,i+1,12);out.push({label:String(i+1),date:localISO(x),current:localISO(x)===todayISO});}
  } else {
    for(let i=0;i<count;i++){const x=new Date(d.getFullYear(),i,15,12);out.push({label:x.toLocaleDateString("en-GB",{month:"short"}),date:localISO(x),current:x.getFullYear()===today.getFullYear()&&x.getMonth()===today.getMonth()});}
  }
  return out.slice(-count);
}
function drawChart(values,labels) {
  const svg=document.getElementById("chart"), W=640,H=260,L=42,R=12,T=12,B=42;
  const vals=values.map(v=>v==null?0:Math.max(0,v));
  const max=Math.max(1,...vals)*1.12, plotH=H-T-B, plotW=W-L-R;
  const slot=plotW/Math.max(1,vals.length), barW=Math.max(3,Math.min(38,slot*.58));
  let s="";
  for(let i=0;i<=4;i++){
    const y=T+plotH*i/4, v=max*(1-i/4);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#40536a" stroke-width="1"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" fill="#9eafc3" font-size="11" text-anchor="end">'+v.toFixed(max<10?1:0)+'</text>';
  }
  vals.forEach((v,i)=>{
    const x=L+i*slot+(slot-barW)/2, h=v/max*plotH, y=T+plotH-h;
    const isToday=!!labels[i]?.current;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="3" fill="'+(isToday?"#27d889":"#438fe3")+'"><title>'+esc(labels[i]?.date||labels[i]?.label)+': '+v.toFixed(2)+' kWh</title></rect>';
    const every=vals.length>20?Math.ceil(vals.length/12):1;
    if(i%every===0 || i===vals.length-1) s+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(H-17)+'" fill="#aebed0" font-size="'+(vals.length>20?9:11)+'" text-anchor="middle">'+esc(labels[i]?.label||"")+'</text>';
  });
  s+='<text x="'+L+'" y="'+(H-2)+'" fill="#8298b1" font-size="10">kWh</text>';
  svg.innerHTML=s;
}
async function loadHistory() {
  const status=document.getElementById("historyStatus");
  status.textContent="Loading FoxCloud history…";
  const dim=mode==="year"?"year":mode==="month"?"month":"week";
  const date=mode==="last7"?todayISO:selectedDate;
  try {
    const p=await getPassword();
    const res=await fetch(API+"history?dimension="+dim+"&date="+encodeURIComponent(date),{headers:{"X-Dashboard-Password":p}});
    const data=await res.json();
    if(res.status===401){sessionStorage.removeItem("energyPassword");password=null;}
    if(!res.ok) throw new Error(data.details||data.error||"Historical report unavailable");
    const vals=data.values||[];
    const labels=makeLabels(dim,date,vals.length);
    drawChart(vals,labels);
    status.textContent=dim==="week"?"Daily generation · seven days ending "+date:dim==="month"?"Daily generation · "+date.slice(0,7):"Monthly generation · "+date.slice(0,4);
  } catch(e) {
    status.textContent=e.message;
    document.getElementById("chart").innerHTML='<text x="320" y="125" fill="#9eafc3" font-size="14" text-anchor="middle">Historical data unavailable</text>';
  }
}
document.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{
  mode=btn.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b===btn));
  if(mode==="last7") selectedDate=todayISO;
  renderPicker();loadHistory();
}));
renderPicker();
loadLive();
loadHistory();
setInterval(loadLive,300000);
</script>
</body>
</html>
